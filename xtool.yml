version: 1
bundleID: app.lumind.tvremote
product: TVRemote
infoPath: Info.plist
# Generated by Tools/generate-appintents-metadata.py. iOS reads this at install
# time to learn the app provides the Live Activity intents; without it a Lock
# Screen button highlights and nothing happens. Both bundles need a copy because
# either process may be asked to resolve the intent.
resources:
  - Metadata.appintents
extensions:
  - product: TVRemoteWidget
    infoPath: TVRemoteWidget-Info.plist
    resources:
      - Metadata.appintents
