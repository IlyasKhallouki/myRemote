name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
          xcrun -sdk iphoneos -show-sdk-path

      - name: Test
        run: swift test

      - name: Install xtool
        run: brew install xtool-org/tap/xtool

      - name: Build unsigned ipa
        run: xtool dev build --ipa

      - name: Locate ipa
        id: locate
        run: |
          IPA=$(find . -name '*.ipa' -print -quit)
          echo "Found: $IPA"
          echo "path=$IPA" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: TVRemote-unsigned-ipa
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error
